name: CI

# Runs on pull requests that change orion (it lives at areas/apps/orion in the
# universe monorepo) or the Orion API it builds against (areas/apis/orion)
on:
  pull_request:
    paths: ["areas/apps/orion/**", "areas/apis/orion/**"]

defaults:
  run:
    working-directory: areas/apps/orion

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: areas/apps/orion/go.mod # uses the pinned toolchain
          cache: false
      - name: Generate the Orion API code
        working-directory: areas/apis/orion # the generated code isn't committed
        run: go tool buf generate
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (with the race detector)
        # -count=1 always runs the tests: a cached run writes an empty coverage profile
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "Orion coverage: $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
