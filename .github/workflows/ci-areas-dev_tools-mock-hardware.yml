name: Run Unit Tests

# Runs on pull requests that change mock-hardware (it lives at
# areas/dev_tools/mock-hardware in the universe monorepo)
on:
  pull_request:
    paths: ["areas/dev_tools/mock-hardware/**"]

defaults:
  run:
    working-directory: areas/dev_tools/mock-hardware

jobs:
  build:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
