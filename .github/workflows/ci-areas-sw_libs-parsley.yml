name: parsley

on:
  push:
    branches: [main]
    paths: ["areas/sw_libs/parsley/**", ".python-version", "pyproject.toml", "uv.lock"]
  pull_request:
    paths: ["areas/sw_libs/parsley/**", ".python-version", "pyproject.toml", "uv.lock"]

# Runs from the project dir; uv resolves against the root workspace and uv.lock.
defaults:
  run:
    working-directory: areas/sw_libs/parsley

jobs:
  lint:
    name: Lint (autopep8, flake8, basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync autopep8 -d -r src/parsley/ --exit-code
      - run: uv run --no-sync flake8
      - run: uv run --no-sync basedpyright src/parsley

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync pytest
