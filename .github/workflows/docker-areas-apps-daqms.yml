name: omnibus-daqms image

# Pushes to main publish `latest` and `sha-<short>`; a GitHub release tagged
# `omnibus-daqms-v<version>` publishes `<version>`. The image name is fixed
# (not derived from the repository) because the DAQ Pi pulls it by this name.
on:
    push:
        branches: [main]
        paths:
            [
                'areas/apps/daqms/**',
                'areas/sw_libs/omnibus-ts/**',
                '.nvmrc',
                'package-lock.json',
                'package.json',
            ]
    release:
        types: [published]

env:
    IMAGE: ghcr.io/waterloo-rocketry/omnibus-daqms

jobs:
    build-and-push:
        if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'omnibus-daqms-v')
        name: Build and Push
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set short SHA
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=match,pattern=omnibus-daqms-v(.*),group=1
                      type=sha,prefix=sha-,format=short

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  # Repo root: the image builds from the shared npm workspace.
                  context: .
                  file: areas/apps/daqms/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VITE_COMMIT_HASH=${{ steps.vars.outputs.sha_short }}
                  cache-from: type=gha,scope=omnibus-daqms
                  cache-to: type=gha,scope=omnibus-daqms,mode=max
