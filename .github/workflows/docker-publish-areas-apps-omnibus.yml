name: omnibus images

# Pushes to main publish `main` and `latest`; PRs publish `pr-<n>`; a GitHub
# release tagged `omnibus-v<version>` publishes `<version>`. The DAQ Pi pins
# images by digest (areas/infra/daq-raspi-deploy), so publishing never changes
# what runs at a test until that digest is bumped.
on:
  push:
    branches: [main]
    paths: ["areas/apps/omnibus/**", "areas/sw_libs/parsley/**", ".python-version", "pyproject.toml", "uv.lock"]
  pull_request:
    branches: [main]
    paths: ["areas/apps/omnibus/**", "areas/sw_libs/parsley/**", ".python-version", "pyproject.toml", "uv.lock"]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'omnibus-v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: areas/apps/omnibus/src/omnibus/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-server
            name: omnibus-server
          - dockerfile: areas/apps/omnibus/src/sources/ljm/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-source-ljm
            name: omnibus-source-ljm
          - dockerfile: areas/apps/omnibus/src/globallog/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-globallog
            name: omnibus-globallog
          - dockerfile: areas/apps/omnibus/src/websocket_server/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-ws-server
            name: omnibus-ws-server
          - dockerfile: areas/apps/omnibus/src/bridge/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-ws-bridge
            name: omnibus-ws-bridge
          - dockerfile: areas/apps/omnibus/src/sources/parsley/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-source-parsley
            name: omnibus-source-parsley
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=omnibus-v(.*),group=1
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.18.0
        with:
          # Repo root: images need the shared uv workspace and uv.lock.
          context: .
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.name }}
          cache-to: type=gha,scope=build-${{ matrix.name }},mode=max
