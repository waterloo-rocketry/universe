name: Validate CI

# Repo-wide checks that always run: the monorepo tooling's tests, and that
# every area workflow's root copy is present, up to date and path-scoped.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.14"
      - run: uv run pytest tools
      - run: uv run tools/build_ci --validate
