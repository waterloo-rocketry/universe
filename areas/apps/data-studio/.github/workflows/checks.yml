name: Data Studio checks
on:
  push:
    paths: ['areas/apps/data-studio/**']
  pull_request:
    paths: ['areas/apps/data-studio/**']
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: areas/apps/data-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: areas/apps/data-studio/.node-version
          cache: pnpm
          cache-dependency-path: areas/apps/data-studio/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: areas/apps/data-studio/backend/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
