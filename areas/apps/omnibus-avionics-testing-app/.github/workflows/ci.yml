name: omnibus-avionics-testing-app

on:
  push:
    branches: [main]
    paths: ["areas/apps/omnibus-avionics-testing-app/**"]
  pull_request:
    paths: ["areas/apps/omnibus-avionics-testing-app/**"]

# Electron app: a standalone npm project (its own package-lock.json and
# node_modules), not part of the root npm workspace.
defaults:
  run:
    working-directory: areas/apps/omnibus-avionics-testing-app

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: areas/apps/omnibus-avionics-testing-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
