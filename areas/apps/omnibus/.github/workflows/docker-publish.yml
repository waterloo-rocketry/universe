name: Build & publish Omnibus images
on:
  push:
    branches:
      - main
    paths: ["areas/apps/omnibus/**", "areas/sw_libs/parsley/**"]
  pull_request:
    branches:
      - main
    paths: ["areas/apps/omnibus/**", "areas/sw_libs/parsley/**"]
env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./areas/apps/omnibus/src/omnibus/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-server
            name: omnibus-server
          - dockerfile: ./areas/apps/omnibus/src/sources/ljm/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-source-ljm
            name: omnibus-source-ljm
          - dockerfile: ./areas/apps/omnibus/src/globallog/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-globallog
            name: omnibus-globallog
          - dockerfile: ./areas/apps/omnibus/src/websocket_server/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-ws-server
            name: omnibus-ws-server
          - dockerfile: ./areas/apps/omnibus/src/bridge/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-ws-bridge
            name: omnibus-ws-bridge
          - dockerfile: ./areas/apps/omnibus/src/sources/parsley/Dockerfile
            image: ghcr.io/waterloo-rocketry/omnibus-source-parsley
            name: omnibus-source-parsley
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.18.0
        with:
          context: .   # the repo root, so the build can see areas/sw_libs/parsley
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}:latest', matrix.image) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.name }}
          cache-to: type=gha,scope=build-${{ matrix.name }},mode=max
