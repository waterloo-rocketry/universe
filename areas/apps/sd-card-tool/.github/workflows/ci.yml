name: sd-card-tool CI

# Runs on pull requests that change sd-card-tool (it lives at
# areas/apps/sd-card-tool in the universe monorepo)
on:
  pull_request:
    paths: ["areas/apps/sd-card-tool/**"]

defaults:
  run:
    working-directory: areas/apps/sd-card-tool

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest

  lint:
    name: Run flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Run flake8
        run: uv run flake8
