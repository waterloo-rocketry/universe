[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sd_card_tool"

[project]
name = "sd-card-tool"
version = "0.1.0"
description = "Formats SD cards and exports logs from Waterloo Rocketry's append-only chunk format"
readme = "README.md"
authors = [
    { name = "Waterloo Rocketry", email = "contact@waterloorocketry.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
sd-card-tool = "sd_card_tool.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
