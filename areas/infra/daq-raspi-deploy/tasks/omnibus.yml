- name: Define omnibus image list
  ansible.builtin.set_fact:
    omnibus_images:
      - ghcr.io/waterloo-rocketry/omnibus-globallog@sha256:6fcedde3ea72b0d49ffd7812a4ca76c21cbfb0a0e34a48e0c646574c7c8b1858
      - ghcr.io/waterloo-rocketry/omnibus-server@sha256:104f969857a4c61a70a4f0621c11af9feafccf94775ef3ce185310f8eb1c967c
      - ghcr.io/waterloo-rocketry/omnibus-source-ljm@sha256:2c07aa238d4b8626712f984a8a817d04ab988151993d71eb41273b8c2fb77be2
      - ghcr.io/waterloo-rocketry/omnibus-ws-bridge@sha256:c20218eda368626e2be25eb6d4608ee69205ff63e12e3de31aeddcc127ec7fcc
      - ghcr.io/waterloo-rocketry/omnibus-ws-server@sha256:b43dff41c05fc83e85694dfef9e3e5a8a3d28a0ab90db31fe08c1d3fee127acf
      - ghcr.io/waterloo-rocketry/omnibus-source-parsley@sha256:1c1fde8bfa0a576516e8b5eebb0b8d6aa81c2e184afdb6602ea3d9c707f61674
      - ghcr.io/waterloo-rocketry/omnibus-daqms@sha256:433a4c4ea0bddd2d25fba356a3f2bb89c38214ef159190182886d061af331646
    omnibus_deploy_dir: "/home/{{ ansible_user }}/omnibus-deploy"
    omnibus_images_dir: "/home/{{ ansible_user }}/omnibus-images"

- name: Check for existing omnibus deployment directory
  ansible.builtin.stat:
    path: "{{ omnibus_deploy_dir }}"
  register: omnibus_deploy_dir_stat

- name: Check for existing omnibus Compose file
  ansible.builtin.stat:
    path: "{{ omnibus_deploy_dir }}/docker-compose.yml"
  register: omnibus_compose_file_stat

- name: Tear down existing omnibus containers
  community.docker.docker_compose_v2:
    project_src: "{{ omnibus_deploy_dir }}"
    state: absent
  when:
    - omnibus_deploy_dir_stat.stat.isdir | default(false)
    - omnibus_compose_file_stat.stat.isreg | default(false)

- name: Create omnibus deployment directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ omnibus_deploy_dir }}"
    - "{{ omnibus_deploy_dir }}/config"
    # - "{{ omnibus_deploy_dir }}/data"
    - "{{ omnibus_images_dir }}"

- name: Copy docker-compose.yml to deployment directory
  ansible.builtin.copy:
    src: services/omnibus.yml
    dest: "{{ omnibus_deploy_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy config.py.example to config directory
  ansible.builtin.copy:
    src: services/config.py
    dest: "{{ omnibus_deploy_dir }}/config/config.py.example"
    mode: "0644"

- name: Start containers up in detached mode
  community.docker.docker_compose_v2:
    project_src: "{{ omnibus_deploy_dir }}" 
    state: present

- name: Get Omnibus image info
  community.docker.docker_image_info:
    name: "{{ item }}"
  loop: "{{ omnibus_images }}"
  register: omnibus_image_info

- name: Ensure each omnibus image resolved locally
  ansible.builtin.assert:
    that:
      - item.images | length == 1
    fail_msg: "Expected exactly one local Docker image for {{ item.item }}, found {{ item.images | length }}"
  loop: "{{ omnibus_image_info.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Save omnibus Docker images to disk
  community.docker.docker_image_export:
    name:
      - "{{ item.images[0].Id }}"
    path: "{{ omnibus_images_dir }}/{{ item.item | regex_replace('.+/', '') | regex_replace(':', '-') | regex_replace('@', '-') }}.tar"
    # Archives exported by image ID have no RepoTags, which the module cannot inspect.
    force: true
  loop: "{{ omnibus_image_info.results }}"
  loop_control:
    label: "{{ item.item }}"
